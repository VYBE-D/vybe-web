name: Apply VYBE admin control update
on:
  push:
    branches:
      - feature/admin-feature-toggles-20261030
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply supplied feature-control source files
        run: |
          python3 - <<'PY'
          import zipfile, subprocess, pathlib
          archive = zipfile.ZipFile("vybe-web-admin-controls.zip")
          base = "vybe-web-main/"
          original = {p.removeprefix(base): archive.read(p) for p in archive.namelist() if p.startswith(base) and not p.endswith("/")}
          for path, content in original.items():
              if path.startswith(".git") or path.startswith("node_modules/") or path.startswith(".next/"):
                  continue
              target = pathlib.Path(path)
              if target.exists():
                  previous = subprocess.run(["git", "show", "HEAD:"+path],capture_output=True)
                  if previous.returncode == 0 and previous.stdout == content:
                      continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          PY
          rm .github/workflows/apply-vybe-admin-controls.yml
          git add README.md src supabase .github/workflows/apply-vybe-admin-controls.yml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement reversible VYBE site feature controls'
            git push origin HEAD:feature/admin-feature-toggles-20261030
          fi
      - name: Validate TypeScript
        run: |
          npm ci
          npx tsc --noEmit
      - name: Run production build
        run: npm run build
